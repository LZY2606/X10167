name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify:offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Dependency preparation (lockfile is authoritative).
      - run: pnpm install --frozen-lockfile

      # Browser for the local smoke stage (no network is used by the tests themselves).
      - run: pnpm exec playwright install --with-deps chromium

      # Single offline verification entry: typecheck, lint, unit tests,
      # adapter matrix, SvelteKit build, prepack content check, browser smoke.
      - run: pnpm run verify:offline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-manifest
          path: artifacts/verify-manifest.json
          if-no-files-found: warn

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance signing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Same verification entry as CI - no separate build order for releases.
      - run: pnpm run verify:offline

      # Release-only extras: sign the manifest and publish with provenance.
      - name: Sign verify manifest
        run: |
          cosign sign-blob --yes \
            --output-signature verify-manifest.json.sig \
            --output-certificate verify-manifest.json.crt \
            artifacts/verify-manifest.json

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/verify-manifest.json
            verify-manifest.json.sig
            verify-manifest.json.crt

      - name: Publish package
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
