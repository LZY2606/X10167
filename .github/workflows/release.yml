name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify offline
    uses: ./.github/workflows/verify.yml
    with:
      upload-manifest: true
    secrets: inherit

  publish:
    name: Sign and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shared verification entry point owns the build/test order.
      # Signing (npm provenance) and the registry upload are appended here.
      - name: Verify offline
        run: pnpm run verify:offline

      - name: Publish with provenance signature
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
